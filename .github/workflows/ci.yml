name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build ruff
      - run: python -m pip install -e .
      - run: ruff check coldfront_pve_provisioner test_settings.py --exclude 'coldfront_pve_provisioner/migrations/*'
      - run: ruff format --check coldfront_pve_provisioner test_settings.py
      - run: python -m compileall -q coldfront_pve_provisioner
      - run: PYTHONPATH=. DJANGO_SETTINGS_MODULE=test_settings django-admin test coldfront_pve_provisioner
      - run: PYTHONPATH=. DJANGO_SETTINGS_MODULE=test_settings django-admin makemigrations --check --dry-run --skip-checks
      - run: python -m build
